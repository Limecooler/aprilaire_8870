# Quality scale rules tracking for the Aprilaire 8870 integration.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # ---- Bronze ----
  action-setup: done
  appropriate-polling: done
  brands:
    status: exempt
    comment: Custom integration distributed via HACS; brands repo entry not required.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-quality: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: todo
    comment: Migration to ConfigEntry.runtime_data planned in a follow-up PR.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ---- Silver ----
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Local RS-485 protocol has no authentication or rotating credentials.
  test-coverage: done

  # ---- Gold ----
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: RS-485 thermostats use a manual address space (1-64) with no broadcast discovery protocol over IP or USB; the in-band SN? probe used by the config flow is integration-specific.
  discovery-update-info:
    status: exempt
    comment: See discovery rule.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Thermostats are statically wired on the RS-485 bus; address changes require physical reconfiguration.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Connection details (host/port or serial port) are validated at setup; the options flow exposes runtime tuning. Reconfiguring the underlying connection requires reinstall.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Bus-attached devices cannot leave dynamically; manual removal via the UI remains available.

  # ---- Platinum ----
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Integration does not use aiohttp / web sessions; serial/telnet only.
  strict-typing:
    status: todo
    comment: Codebase passes mypy with default settings; full --strict cleanup is tracked separately. py.typed marker is in place.
